<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Overconfidence Olympiad</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c232d;
    --ink: #e6edf3;
    --ink-dim: #9aa7b4;
    --ink-faint: #6b7885;
    --line: #2a323d;
    --accent: #f2c14e;      /* swagger gold */
    --good: #57c785;
    --bad: #e5657a;
    --identity: #8a94a0;
    --linear: #3fc9b8;
    --platt: #5aa9e6;
    --isotonic: #f2884b;
    --binning: #b98cf0;
    --radius: 14px;
    --shadow: 0 6px 24px rgba(0,0,0,.35);
    font-synthesis: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #1a212b 0%, var(--bg) 60%);
    color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font-size: clamp(28px, 5vw, 44px); line-height: 1.05; margin: 0 0 6px; letter-spacing: -0.02em; }
  h2 { font-size: 22px; margin: 28px 0 10px; letter-spacing: -0.01em; }
  h3 { font-size: 16px; margin: 18px 0 8px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
  p { margin: 0 0 12px; }
  a { color: var(--platt); }
  .subtitle { color: var(--ink-dim); font-size: 18px; }
  .card {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
    margin: 16px 0;
  }
  .muted { color: var(--ink-dim); }
  .faint { color: var(--ink-faint); }
  .tag {
    display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--ink-dim); background: rgba(255,255,255,.02);
  }
  .tag.easy { color: var(--good); border-color: rgba(87,199,133,.4); }
  .tag.medium { color: var(--accent); border-color: rgba(242,193,78,.4); }
  .tag.hard { color: var(--bad); border-color: rgba(229,101,122,.4); }
  button {
    font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--ink); padding: 11px 16px; transition: .12s;
  }
  button:hover { border-color: var(--ink-faint); background: #232c37; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: #201a06; border-color: var(--accent); font-weight: 700; }
  button.primary:hover { filter: brightness(1.06); }
  button.ghost { background: transparent; }
  button:disabled { opacity: .45; cursor: default; }
  .options { display: grid; gap: 10px; margin: 16px 0; }
  .opt {
    text-align: left; padding: 14px 16px; display: flex; gap: 12px; align-items: center;
    border-radius: 12px; width: 100%;
  }
  .opt .k { font-weight: 800; color: var(--ink-faint); min-width: 20px; }
  .opt.sel { border-color: var(--accent); background: #26211296; }
  .opt.sel .k { color: var(--accent); }
  .likert { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 14px 0; }
  .likert button { text-align: center; padding: 12px 8px; line-height: 1.2; }
  .likert .pct { display: block; font-weight: 800; font-size: 18px; margin-top: 2px; }
  .likert button:nth-child(1) .pct { color: #8a94a0; }
  .likert button:nth-child(2) .pct { color: #86b8d6; }
  .likert button:nth-child(3) .pct { color: #7fc6b0; }
  .likert button:nth-child(4) .pct { color: #cbd06a; }
  .likert button:nth-child(5) .pct { color: #e6a94e; }
  .likert button:nth-child(6) .pct { color: #e5657a; }
  .bar { height: 10px; background: var(--panel-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--isotonic)); transition: width .3s; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--ink-dim); font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
  tbody tr:hover { background: rgba(255,255,255,.02); }
  .best { color: var(--good); font-weight: 700; }
  .metric-name { border-bottom: 1px dotted var(--ink-faint); cursor: help; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: middle; margin-right: 6px; }
  .verdict { text-align: center; padding: 8px 0 4px; }
  .verdict .persona { font-size: clamp(26px, 5vw, 38px); font-weight: 800; letter-spacing: -0.02em; margin: 6px 0; }
  .disclaimer { border-left: 3px solid var(--accent); padding: 8px 0 8px 14px; margin: 12px 0; color: var(--ink-dim); background: rgba(242,193,78,.05); border-radius: 0 8px 8px 0; }
  .disclaimer.severe { border-color: var(--bad); background: rgba(229,101,122,.06); }
  details { border: 1px solid var(--line); border-radius: 10px; padding: 4px 14px; margin: 12px 0; background: rgba(255,255,255,.015); }
  details summary { cursor: pointer; font-weight: 700; padding: 8px 0; }
  details[open] summary { border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .review-item { border-bottom: 1px solid var(--line); padding: 12px; border-radius: 8px; transition: background .15s, box-shadow .15s; }
  .review-item:last-child { border-bottom: 0; }
  .review-item.hl { background: rgba(242,193,78,.09); box-shadow: inset 3px 0 0 var(--accent); }
  .probe-jump { margin: 0 0 2px; font-size: 14px; }
  .probe-jump button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 2px; }
  .probe-jump button:hover { filter: brightness(1.1); }
  .probe-jump.empty button { color: var(--ink-faint); text-decoration: none; cursor: default; }
  .grid-mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .mini { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 6px; }
  .mini-h { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .pill { font-size: 13px; padding: 2px 8px; border-radius: 999px; font-weight: 700; }
  .pill.ok { background: rgba(87,199,133,.14); color: var(--good); }
  .pill.no { background: rgba(229,101,122,.14); color: var(--bad); }
  svg text { fill: var(--ink-dim); font-size: 12px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-dim); margin-top: 8px; }
  .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 12px; }
  .kpi .box { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .kpi .box .v { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .kpi .box .l { font-size: 12px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .06em; }
  .footer { color: var(--ink-faint); font-size: 13px; text-align: center; margin-top: 30px; }
  .center { text-align: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; padding: 9px 16px; }
  .seg button.on { background: var(--accent); color: #201a06; font-weight: 700; }
  .probe { border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 14px; }
  .probe-sentence { font-size: 19px; margin: 0 0 10px; }
  .probe-sentence strong { font-variant-numeric: tabular-nums; }
  .probe-caveat { font-size: 13px; margin: 2px 0 4px; min-height: 1.2em; }
  .probe input[type="range"] { width: 100%; accent-color: var(--accent); margin: 2px 0 10px; }
  .probe .seg button { font-size: 13px; padding: 7px 12px; }
  .probe .seg button.on { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 0 0 2px currentColor; }
  .toggle-eq { font-size: 13px; }
</style>
</head>

    write(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* quota / private mode: run in-memory */ } },
    history() { return Store.read(K.hist, []); },
    seen() { return new Set(Store.read(K.seen, [])); },
    rounds() { return Store.read(K.rounds, []); },
    commitRound(records) {
      const hist = Store.history().concat(records);
      Store.write(K.hist, hist);
      const seen = Store.seen();
      records.forEach((r) => seen.add(r.qid));
      Store.write(K.seen, [...seen]);
      const brier = Calib.brier(hist.map((r) => r.conf), hist.map((r) => r.correct ? 1 : 0));
      const rounds = Store.rounds();
      rounds.push({ n: hist.length, brier });
      Store.write(K.rounds, rounds);
      return hist;
    },
    wipe() { [K.hist, K.seen, K.rounds].forEach((k) => localStorage.removeItem(k)); },
  };

  // ---- question sampling (local, from the embedded bank) --------------
  function sample(n, difficulty) {
    const bank = (!difficulty || difficulty === "mixed") ? QUESTION_BANK : QUESTION_BANK.filter((q) => q.difficulty === difficulty);
    const seen = Store.seen();
    let pool = bank.filter((q) => !seen.has(q.id));
    let reset = false;
    if (pool.length < n) { // exhausted this difficulty in this browser — recycle it
      const ids = new Set(bank.map((q) => q.id));
      Store.write(K.seen, [...seen].filter((id) => !ids.has(id)));
      pool = bank.slice(); reset = true;
    }
    const picked = shuffle(pool.slice()).slice(0, n);
    return { reset, questions: picked.map((q) => {
      const order = shuffle(q.options.map((_, i) => i));
      return {
        id: q.id, category: q.category, difficulty: q.difficulty, question: q.question,
        options: order.map((i) => q.options[i]),
        answerIndex: order.indexOf(q.answerIndex),
      };
    }) };
  }

  // ---- frozen AI baselines (for the "You vs. the machines" tab) --------
  const AI_ORDER = ["opus", "fable", "haiku"];
  const aiRecords = (key) => (AI_BASELINES[key]?.pairs || []).map(([conf, correct]) => ({ conf, correct: !!correct }));

  // ---- copy -----------------------------------------------------------
  const PROGRESS_JOKes = [
    "No feedback yet. Suffer in ambiguity.",
    "Your future self is judging your confidence right now.",
    "Every 'Certain' is a promissory note to reality.",
    "The Brier score sees all. The Brier score forgets nothing.",
    "Calibration is just humility with a spreadsheet.",
    "Somewhere, a statistician feels a disturbance.",
    "You can still turn back. (You cannot turn back.)",
    "Confidence is free. Accuracy is expensive.",
  ];

  // ---- app state ------------------------------------------------------
  let S = { view: "home", roundLen: 25, difficulty: "mixed" };

  // ====================================================================
  // HOME
  // ====================================================================
  function renderHome() {
    const hist = Store.history();
    const n = hist.length;
    let career = "";
    if (n > 0) {
      const p = hist.map((r) => r.conf), y = hist.map((r) => r.correct ? 1 : 0);
      const gap = Calib.overconfidenceGap(p, y);
      career = `<div class="card"><h3>Your standing record</h3>
        <div class="kpi">
          <div class="box"><div class="v">${n}</div><div class="l">answers logged</div></div>
          <div class="box"><div class="v">${pct(Calib.mean(y))}</div><div class="l">accuracy</div></div>
          <div class="box"><div class="v">${pct(Calib.mean(p))}</div><div class="l">avg confidence</div></div>
          <div class="box"><div class="v" style="color:${gap > 0.03 ? "var(--bad)" : gap < -0.03 ? "var(--platt)" : "var(--good)"}">${gap > 0 ? "+" : ""}${pct(gap)}</div><div class="l">overconfidence gap</div></div>
        </div>
        <div class="row between" style="margin-top:14px">
          <button class="primary" id="btnProfile">View full profile →</button>
          <button class="ghost" id="btnWipe">Wipe my shameful history</button>
        </div></div>`;
    }
    app.innerHTML = `
      <h1>The Overconfidence Olympiad</h1>
      <p class="subtitle">Answer trivia, rate your confidence, then watch four calibration
      methods try to rescue your Brier score. Spoiler: they can only do so much.</p>
      <div class="card">
        <p>You'll get multiple-choice questions and, after each pick, rate how sure you are.
        No feedback until the end — that's what keeps the reveal honest (and cruel). Everything
        is scored with real statistics: Brier, ECE, AUROC, log loss, and the calibration curve
        of your soul.</p>
        <h3>Round length</h3>
        <div class="seg" role="group" aria-label="Round length">
          ${[10, 25, 50].map((v) => `<button data-len="${v}" class="${S.roundLen === v ? "on" : ""}">${v}</button>`).join("")}
        </div>

        <div class="seg" role="group" aria-label="Difficulty">
          ${["mixed", "easy", "medium", "hard"].map((d) => `<button data-diff="${d}" class="${S.difficulty === d ? "on" : ""}">${d}</button>`).join("")}
        </div>
        <p class="faint" style="margin-top:8px">10 is a coffee break; 25 is enough for a defensible verdict; 50 is the full audit.
        The frontier models in the comparison played <strong>hard</strong>.</p>
        <div class="row" style="margin-top:16px">

        </div>
      </div>
      ${career}
      <p class="footer">Everything runs and stays in your browser — no server, no data leaves this page.
      Questions modified from the <a href="https://opentdb.com" target="_blank" rel="noopener">Open Trivia Database</a>
      (<a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>)
      plus hand-written fills.</p>`;

    app.querySelectorAll("[data-len]").forEach((b) =>
      b.addEventListener("click", () => { S.roundLen = +b.dataset.len; renderHome(); }));
    app.querySelectorAll("[data-diff]").forEach((b) =>
      b.addEventListener("click", () => { S.difficulty = b.dataset.diff; renderHome(); }));
    app.querySelector("#btnStart").addEventListener("click", startRound);
    const w = app.querySelector("#btnWipe");
    if (w) w.addEventListener("click", () => {
      if (confirm("Erase your entire calibration history? Your Brier score will be reborn, sinless.")) {
        Store.wipe(); renderHome();
      }
    });
    const prof = app.querySelector("#btnProfile");
    if (prof) prof.addEventListener("click", viewProfile);
  }

  // Jump straight to the career stats screen without playing a round.
  function viewProfile() {
    const hist = Store.history();
    if (!hist.length) return;
    S = { view: "results", profile: true, roundLen: S.roundLen, difficulty: S.difficulty, round: [], scope: "career", hist, probe: S.probe };
    renderResults();
  }

  // ====================================================================
  // PLAYING
  // ====================================================================
  function startRound() {
    const s = sample(S.roundLen, S.difficulty);
    S = { view: "playing", roundLen: S.roundLen, difficulty: S.difficulty, questions: s.questions, i: 0, phase: "pick", chosen: null, records: [], probe: S.probe };
    renderPlaying();
  }

  function renderPlaying() {
    const q = S.questions[S.i];
    const progress = S.i / S.questions.length;
    const joke = PROGRESS_JOKes[S.i % PROGRESS_JOKes.length];
    const opts = q.options.map((o, i) =>
      `<button class="opt ${S.chosen === i ? "sel" : ""}" data-opt="${i}">
        <span class="k">${String.fromCharCode(65 + i)}</span><span>${esc(o)}</span></button>`).join("");
    const likert = S.phase === "conf" ? `
      <div class="card">
        <h3>How sure are you?</h3>
        <div class="likert">
          ${LIKERT.map((p, i) => `<button data-conf="${i}">${LABELS[i]}<span class="pct">${Math.round(p * 100)}%</span></button>`).join("")}
        </div>
        <p class="faint">Chance is 25% with four options. Be honest — the reveal remembers.</p>
      </div>` : "";

    app.innerHTML = `
      <div class="row between">
        <span class="tag ${q.difficulty}">${q.difficulty}</span>
        <span class="muted">${CATS[q.category] || q.category} · ${S.i + 1} / ${S.questions.length}</span>
      </div>
      <div class="bar" style="margin:12px 0"><span style="width:${progress * 100}%"></span></div>
      <p class="faint" style="margin-top:-4px">${joke}</p>
      <div class="card">
        <h2 style="margin-top:4px">${esc(q.question)}</h2>
        <div class="options">${opts}</div>
      </div>
      ${likert}`;

    // Picking an option (or changing your mind) is always allowed until you
    // lock it in by choosing a confidence level.
    app.querySelectorAll("[data-opt]").forEach((b) =>
      b.addEventListener("click", () => { S.chosen = +b.dataset.opt; S.phase = "conf"; renderPlaying(); }));
    app.querySelectorAll("[data-conf]").forEach((b) =>
      b.addEventListener("click", () => answerQuestion(+b.dataset.conf)));
  }

  function answerQuestion(confIdx) {
    const q = S.questions[S.i];
    S.records.push({
      qid: q.id, cat: q.category, diff: q.difficulty,
      conf: LIKERT[confIdx], confIdx,
      correct: S.chosen === q.answerIndex,
      chosen: S.chosen, answerIndex: q.answerIndex,
      question: q.question, options: q.options,
    });
    S.i++; S.chosen = null; S.phase = "pick";
    if (S.i >= S.questions.length) finishRound();
    else renderPlaying();
  }

  // ====================================================================
  // RESULTS
  // ====================================================================
  function finishRound() {
    const roundRecords = S.records.map((r) => ({ qid: r.qid, conf: r.conf, correct: r.correct, cat: r.cat, diff: r.diff }));
    const hist = Store.commitRound(roundRecords);
    S = { view: "results", roundLen: S.roundLen, difficulty: S.difficulty, round: S.records, scope: hist.length >= 40 ? "career" : "round", hist, probe: S.probe };
    renderResults();
  }

  function models(hist) {
    const p = hist.map((r) => r.conf), y = hist.map((r) => r.correct ? 1 : 0);
    return {
      uncalibrated: Calib.fitIdentity(),
      linear: Calib.fitLinear(p, y),
      platt: Calib.fitPlatt(p, y),
      isotonic: Calib.fitIsotonic(p, y),
      binning: Calib.fitBinning(p, y),
    };
  }

  function report(records, mdls) {
    const p = records.map((r) => r.conf), y = records.map((r) => (r.correct ? 1 : 0));
    const out = {};
    for (const [name, mdl] of Object.entries(mdls)) {
      const preds = p.map(mdl.apply);
      out[name] = {
        brier: Calib.brier(preds, y), ece: Calib.ece(p, preds, y),
        logLoss: Calib.logLoss(preds, y), auroc: Calib.auroc(preds, y), preds,
      };
    }
    return out;
  }

  const DISCLAIMERS = [
    { max: 15, sev: true, text: "n is in the single-to-low-double digits. Every curve below is essentially interpretive dance. Fitting isotonic regression on this is a crime in three jurisdictions — keep playing to make it legal." },
    { max: 30, sev: true, text: "Under 30 data points. The calibration methods will happily produce numbers; those numbers have the epistemic status of a horoscope. The error bars are the honest part." },
    { max: 50, sev: false, text: "Between 30 and 50 points — enough to gossip about your calibration, not enough to testify under oath. Treat trends as suggestive." },
    { max: 100, sev: false, text: "You've got a real sample now. Platt and binning are trustworthy-ish; isotonic still wants more. The verdict is starting to mean something." },
    { max: Infinity, sev: false, text: "Over 100 answers. Your isotonic fit is now legally admissible. The Murphy decomposition below is stable enough to take personally." },
  ];
  const disclaimerFor = (n) => DISCLAIMERS.find((d) => n < d.max) || DISCLAIMERS[DISCLAIMERS.length - 1];

  function verdict(records) {
    const p = records.map((r) => r.conf), y = records.map((r) => (r.correct ? 1 : 0));
    const gap = Calib.overconfidenceGap(p, y);
    const acc = Calib.mean(y);
    const mur = Calib.murphy(p, p, y);
    const resolution = mur ? mur.resolution : 0;
    const confSpread = Math.sqrt(Calib.mean(p.map((v) => (v - Calib.mean(p)) ** 2)));
    let persona, blurb;
    const discriminating = resolution > 0.03; // meaningfully separates right from wrong
    if (Math.abs(gap) <= 0.05 && discriminating) {
      persona = "Superforecaster (suspiciously so)";
      blurb = "Well-calibrated and actually discriminating. Either you know things and know that you know them, or you've seen this quiz before.";
    } else if (gap > 0.15) {
      persona = "TED-talk energy";
      blurb = "Your confidence writes checks your accuracy can't cash. Magnificent stage presence; the Brier score is unimpressed.";
    } else if (gap > 0.05) {
      persona = "Cheerfully overconfident";
      blurb = "A gentle, human amount of swagger. You round your hunches up. Most people do.";
    } else if (gap < -0.15) {
      persona = "Please believe in yourself; your Brier score does";
      blurb = "You're right far more often than you'll admit. This is underconfidence, and it's costing you points you already earned.";
    } else if (gap < -0.05) {
      persona = "Endearingly modest";
      blurb = "You hedge more than the evidence requires. Nudge your 'Fairly sure' up to 'Confident' and your score improves for free.";
    } else if (!discriminating && confSpread > 0.12) {
      persona = "Confidently wrong: the LinkedIn special";
      blurb = "You vary your confidence dramatically, but it barely tracks whether you're right. Bold, evenly-distributed, and uncorrelated with reality.";
    } else {
      persona = "Respectably calibrated";
      blurb = "No dramatic pathology here. Your confidence roughly matches your accuracy. Statisticians nod approvingly; nobody makes a documentary about you.";
    }
    return { persona, blurb, gap, acc, resolution };
  }

  function renderResults() {
    if (!S.probe) S.probe = { conf: 0.85, method: "platt" };
    const profile = !!S.profile;         // viewing career stats without a round
    if (profile) S.scope = "career";
    const mdls = models(S.hist);
    const roundRecords = (S.round || []).map((r) => ({ conf: r.conf, correct: r.correct }));
    const careerRecords = S.hist;
    const active = S.scope === "career" ? careerRecords : roundRecords;
    const rep = report(active, mdls);
    const n = active.length;
    const careerN = careerRecords.length;
    const v = verdict(profile ? careerRecords : (S.scope === "career" && careerN >= 50 ? careerRecords : roundRecords));
    const disc = disclaimerFor(careerN);
    const roundAcc = Calib.mean(roundRecords.map((r) => (r.correct ? 1 : 0)));
    const careerAcc = Calib.mean(careerRecords.map((r) => (r.correct ? 1 : 0)));

    // best (lowest) per metric for highlighting
    const methodNames = ["uncalibrated", "linear", "platt", "isotonic", "binning"];
    // slider offers the corrections only — the identity ("uncalibrated") is
    // just the diagonal, so linear regression is the interesting baseline.
    const sliderMethods = ["linear", "platt", "isotonic", "binning"];
    const bestOf = (key, lower = true) => {
      let best = null, bi = null;
      methodNames.forEach((m) => { const x = rep[m][key]; if (x == null || !isFinite(x)) return; if (best == null || (lower ? x < best : x > best)) { best = x; bi = m; } });
      return bi;
    };
    const bestBrier = bestOf("brier"), bestEce = bestOf("ece"), bestLog = bestOf("logLoss");

    const METHOD_LABEL = { uncalibrated: "Uncalibrated", linear: "Linear", platt: "Platt", isotonic: "Isotonic", binning: "Binning" };
    const METHOD_COLOR = { uncalibrated: "var(--identity)", linear: "var(--linear)", platt: "var(--platt)", isotonic: "var(--isotonic)", binning: "var(--binning)" };
    const TIP = {
      brier: "Brier: mean squared distance between your swagger and reality. 0 is perfect, 0.25 is coin-flip energy, lower is better.",
      ece: "ECE: on average, how far your confidence sits from your actual accuracy, across the six levels. 0 means your 70% really happens 70% of the time.",
      logLoss: "Log loss: punishes confident mistakes brutally. Being 'Certain' and wrong hurts here more than anywhere else.",
      auroc: "AUROC: can your confidence tell right answers from wrong ones at all? 0.5 is a coin; 1.0 is a lie detector. Recalibration can't change it.",
    };
    const cell = (m, key, best, d = 3) => {
      const x = rep[m][key];
      const cls = (m === best && x != null) ? "best" : "";
      return `<td class="${cls}">${key === "ece" ? pct(x, 1) : num(x, d)}</td>`;
    };

    const table = `
      <table>
        <thead><tr>
          <th>Method</th>
          <th><span class="metric-name" title="${TIP.brier}">Brier</span></th>
          <th><span class="metric-name" title="${TIP.ece}">ECE</span></th>
          <th><span class="metric-name" title="${TIP.logLoss}">Log loss</span></th>
          <th><span class="metric-name" title="${TIP.auroc}">AUROC</span></th>
        </tr></thead>
        <tbody>
          ${methodNames.map((m) => `<tr>
            <td><span class="swatch" style="background:${METHOD_COLOR[m]}"></span>${METHOD_LABEL[m]}</td>
            ${cell(m, "brier", bestBrier)}
            ${cell(m, "ece", bestEce)}
            ${cell(m, "logLoss", bestLog)}
            <td>${num(rep[m].auroc, 3)}</td>
          </tr>`).join("")}
        </tbody>
      </table>
      <p class="faint" style="margin-top:8px">AUROC never improves under recalibration: linear and Platt
      preserve it exactly (both strictly monotone), while isotonic and binning can only smudge it by
      pooling levels into ties — none of them can re-order which answers you were surest about. The
      punchline: <em>calibration can't fix your discrimination; only knowing things can.</em></p>`;

    const murphy = Calib.murphy(careerRecords.map((r) => r.conf), careerRecords.map((r) => r.conf), careerRecords.map((r) => (r.correct ? 1 : 0)));
    const murphyBlock = careerN >= 30 && murphy ? `
      <details><summary>Murphy decomposition of your career Brier</summary>
        <p class="faint">Brier = reliability − resolution + uncertainty. Reliability is your miscalibration
        (lower is better); resolution is how well you separate right from wrong (higher is better);
        uncertainty is the difficulty of the questions themselves, which you can't change.</p>
        <div class="kpi">
          <div class="box"><div class="v">${num(murphy.reliability)}</div><div class="l">reliability ↓</div></div>
          <div class="box"><div class="v">${num(murphy.resolution)}</div><div class="l">resolution ↑</div></div>
          <div class="box"><div class="v">${num(murphy.uncertainty)}</div><div class="l">uncertainty</div></div>
          <div class="box"><div class="v">${num(murphy.brier)}</div><div class="l">= Brier</div></div>
        </div>
      </details>` : "";

    const rounds = Store.rounds();
    const sparkBlock = rounds.length >= 2 ? `
      <div class="card"><h3>Career Brier over time</h3>
        ${sparkline(rounds)}
        <p class="faint">Each point is your whole-career Brier after a round. Watch it converge — or not.</p>
      </div>` : "";

    app.innerHTML = `
      <div class="row between">
        <h1 style="margin:0">${profile ? "Your profile" : "The reckoning"}</h1>
        <button class="ghost" id="btnHome">← Home</button>
      </div>
      ${profile ? `<div class="seg" role="group" aria-label="Profile view" style="margin-bottom:14px">
        <button class="on">Your card</button>
        <button id="btnCompare">You vs. the machines</button>
      </div>` : ""}
      <div class="card verdict">
        <span class="tag">Verdict</span>
        <div class="persona">${esc(v.persona)}</div>
        <p class="muted" style="max-width:620px;margin:0 auto">${esc(v.blurb)}</p>
        <div class="kpi" style="margin-top:18px">
          <div class="box"><div class="v">${pct(profile ? careerAcc : roundAcc)}</div><div class="l">${profile ? "career accuracy" : "this round"}</div></div>
          <div class="box"><div class="v">${v.gap > 0 ? "+" : ""}${pct(v.gap)}</div><div class="l">over/under-confidence</div></div>
          <div class="box"><div class="v">${careerN}</div><div class="l">career answers</div></div>
        </div>
      </div>

      <div class="disclaimer ${disc.sev ? "severe" : ""}">${disc.text}</div>

      <div class="row between" style="margin-top:8px">
        <h2 style="margin:0">Calibration curve</h2>
        ${profile ? "" : `<div class="seg" role="group" aria-label="Scope">
          <button data-scope="round" class="${S.scope === "round" ? "on" : ""}">This round (${roundRecords.length})</button>
          <button data-scope="career" class="${S.scope === "career" ? "on" : ""}">Career (${careerN})</button>
        </div>`}
      </div>
      <div class="card">
        <div class="probe">
          <p class="probe-sentence">So when you say you're <strong id="probeX">–</strong> confident,
          you <span id="probeVerb">really mean</span> <strong id="probeY">–</strong>.</p>
          <p class="probe-caveat faint" id="probeCaveat"></p>
          <input type="range" id="probeSlider" min="25" max="99" step="1" value="${Math.round(S.probe.conf * 100)}"
            aria-label="Stated confidence to translate">
          <div class="seg" role="group" aria-label="Calibration method for the translator">
            ${sliderMethods.map((mm) => `<button data-probe-m="${mm}" class="${S.probe.method === mm ? "on" : ""}"
              style="color:${METHOD_COLOR[mm]}">${METHOD_LABEL[mm]}</button>`).join("")}
          </div>
          ${profile ? "" : `<p class="probe-jump" id="probeJump"></p>`}
        </div>
        ${reliabilityDiagram(active, mdls)}
        <div class="legend">
          <span><span class="swatch" style="background:var(--accent)"></span>your accuracy (dot size = count, bars = 95% Wilson)</span>
          <span><span class="swatch" style="background:var(--linear)"></span>Linear</span>
          <span><span class="swatch" style="background:var(--platt)"></span>Platt</span>
          <span><span class="swatch" style="background:var(--isotonic)"></span>Isotonic</span>
          <span><span class="swatch" style="background:var(--binning)"></span>Binning</span>
          <span><span class="swatch" style="background:var(--identity)"></span>perfect</span>
        </div>
      </div>

      <div class="grid2">
        <div class="card"><h3>Metrics (${S.scope}, n=${n})</h3>${table}</div>
        <div class="card"><h3>How often you used each level</h3>${histogram(active)}</div>
      </div>

      ${murphyBlock}
      ${sparkBlock}

      <details><summary>What just happened?</summary>
        <p><strong>Calibration vs. discrimination.</strong> Two different virtues. Discrimination is
        whether your confidence <em>sorts</em> right answers from wrong ones — that's AUROC, and no amount
        of rescaling can improve it. Calibration is whether your "70%" actually happens 70% of the time.
        You can be perfectly calibrated and useless (say 55% on everything and be right 55% of the time),
        or sharply discriminating but miscalibrated (always overconfident by 20 points). The methods below
        only touch the second thing.</p>
        <p><strong>What the four methods actually do.</strong> Each learns a function that maps your stated
        confidence to a corrected probability. <span style="color:var(--linear)">Linear regression</span> is the
        naive baseline — a straight best-fit line through your reliability dots; simplest, but it can predict
        below 0% or above 100% (we clamp it). <span style="color:var(--platt)">Platt</span> fits an S-shaped curve
        (a logistic) — smooth, only two parameters, great when your miscalibration is a simple "shift everything
        down 15%." <span style="color:var(--isotonic)">Isotonic</span> regression is non-parametric: it finds the
        best <em>non-decreasing step function</em>, so it bends wherever your data bends — but with few points it
        overfits wildly. <span style="color:var(--binning)">Binning</span> is the bluntest: just replace each
        confidence level with the accuracy you actually got at it (it need not even stay monotone).</p>
        <p><strong>Why n matters so much.</strong> With ten answers, each of your six confidence levels holds
        maybe one or two data points, and "accuracy" at a level is 0%, 50%, or 100% — pure noise. The Wilson
        error bars on the diagram show it: at small n they're enormous. Calibration is a promise about
        long-run frequencies, and you can't estimate a frequency from two coin flips. This is why the toy
        nags you to keep playing: the statistics only become honest across many rounds.</p>
        <details class="toggle-eq"><summary>Show the equations</summary>
          <p class="faint">Brier = mean((p − y)²). &nbsp; ECE = Σₖ (nₖ/N)·|p̄ₖ − ōₖ|. &nbsp;
          Log loss = −mean(y·ln p + (1−y)·ln(1−p)). &nbsp;
          Platt: σ(a·logit(p) + b), fit by Newton's method. &nbsp;
          Isotonic: Pool Adjacent Violators. &nbsp;
          Murphy: Brier = reliability − resolution + uncertainty. &nbsp;
          AUROC = (rank-sum of positives − nₚ(nₚ+1)/2) / (nₚ·nₙ), ties = 0.5. &nbsp;
          Wilson 95% interval on each bin.</p>
        </details>
      </details>

      ${profile ? "" : `<details id="reviewDetails"><summary>Per-question review (this round) — counterfactual uses <span id="reviewMethod" style="color:${METHOD_COLOR[S.probe.method]}">${METHOD_LABEL[S.probe.method]}</span></summary>
        ${reviewList(S.round)}
      </details>`}

      <div class="row" style="margin-top:20px">
        <button class="primary" id="btnAgain">${profile ? "Start a round" : "Go again (" + S.roundLen + ")"} →</button>
        ${profile ? "" : `<button class="ghost" id="btnVsAI">How did the AIs do? →</button>`}
        <button class="ghost" id="btnHome2">Home</button>
      </div>
      <p class="footer">Fits use your full career history (${careerN} answers).${profile ? "" : " The toggle above only changes which slice the table and curve summarize."}</p>`;

    // --- confidence translator (probe) ---
    const qs = (sel) => app.querySelector(sel);
    function updateProbe() {
      const mdl = mdls[S.probe.method];
      const x = S.probe.conf;
      const yv = Calib.clamp(mdl.apply(x), 0, 1);
      const color = METHOD_COLOR[S.probe.method];
      qs("#probeX").textContent = Math.round(x * 100) + "%";
      const yEl = qs("#probeY");
      yEl.textContent = Math.round(yv * 100) + "%";
      yEl.style.color = color;
      const px = relX(x), pyCurve = relY(yv), pyDiag = relY(x);
      const line = qs("#probeLine"), diag = qs("#probeDiag"), dot = qs("#probeDot"), lbl = qs("#probeLabel");
      line.setAttribute("x1", px); line.setAttribute("x2", px);
      line.setAttribute("y1", pyDiag); line.setAttribute("y2", pyCurve);
      line.setAttribute("stroke", color);
      diag.setAttribute("cx", px); diag.setAttribute("cy", pyDiag);
      dot.setAttribute("cx", px); dot.setAttribute("cy", pyCurve);
      dot.setAttribute("fill", color);
      const flip = x > 0.88; // keep the label inside the plot near the right edge
      lbl.setAttribute("x", flip ? px - 12 : px + 12);
      lbl.setAttribute("y", pyCurve + 4);
      lbl.setAttribute("text-anchor", flip ? "end" : "start");
      lbl.setAttribute("fill", color);
      lbl.textContent = Math.round(yv * 100) + "%";

      // --- practice what we preach: the translated value is an estimate from
      // however many answers landed at this confidence level. Hedge the verb
      // and show the Wilson interval so we don't state a point estimate from
      // two data points as if it were fact. ---
      let nearestLvl = Calib.LIKERT[0];
      for (const lv of Calib.LIKERT) if (Math.abs(lv - x) < Math.abs(nearestLvl - x)) nearestLvl = lv;
      const at = active.filter((r) => Math.abs(r.conf - nearestLvl) < 1e-9);
      const kAt = at.reduce((a, r) => a + (r.correct ? 1 : 0), 0);
      const w = Calib.wilson(kAt, at.length);
      const verbEl = qs("#probeVerb"), cavEl = qs("#probeCaveat");
      if (verbEl && cavEl) {
        const lvlPct = Math.round(nearestLvl * 100) + "%";
        if (at.length === 0) {
          verbEl.textContent = "have no track record, so a model can only guess";
          cavEl.textContent = `You've logged 0 answers at ${lvlPct}. That number is pure extrapolation — don't trust it.`;
        } else if (at.length < 5) {
          verbEl.textContent = "might mean";
          cavEl.innerHTML = `…but that's fit to just <strong>${at.length}</strong> answer${at.length === 1 ? "" : "s"} at ${lvlPct} (you got ${kAt} right). Your true rate there is anywhere in <strong>${Math.round(w.lo * 100)}–${Math.round(w.hi * 100)}%</strong> — barely evidence. Keep playing.`;
        } else if (at.length < 15) {
          verbEl.textContent = "probably mean";
          cavEl.innerHTML = `Based on ${at.length} answers at ${lvlPct} (95% CI <strong>${Math.round(w.lo * 100)}–${Math.round(w.hi * 100)}%</strong>) — suggestive, not settled.`;
        } else {
          verbEl.textContent = "really mean";
          cavEl.innerHTML = `Based on ${at.length} answers at ${lvlPct} (95% CI ${Math.round(w.lo * 100)}–${Math.round(w.hi * 100)}%).`;
        }
      }

      // --- keep the per-question review in sync with the chosen method ---
      // (profile mode has no round, so there's nothing to sync or jump to)
      if (profile) return;
      const label = METHOD_LABEL[S.probe.method];
      const rm = qs("#reviewMethod");
      if (rm) { rm.textContent = label; rm.style.color = color; }
      // nearest Likert level to the slider position -> what to highlight
      let nearest = Calib.LIKERT[0];
      for (const lv of Calib.LIKERT) if (Math.abs(lv - x) < Math.abs(nearest - x)) nearest = lv;
      let matches = 0;
      app.querySelectorAll(".review-item").forEach((it) => {
        const lvl = +it.dataset.level;
        const cf = it.querySelector(".cf-value");
        cf.textContent = Math.round(Calib.clamp(mdl.apply(lvl), 0, 1) * 100) + "%";
        cf.style.color = color;
        const on = Math.abs(lvl - nearest) < 1e-9;
        it.classList.toggle("hl", on);
        if (on) matches++;
      });
      // deep-link line under the slider
      const jump = qs("#probeJump");
      const lvlPct = Math.round(nearest * 100) + "%";
      if (matches > 0) {
        jump.classList.remove("empty");
        jump.innerHTML = `<button type="button">You said ${lvlPct} on ${matches} of this round's answer${matches === 1 ? "" : "s"} — jump to ${matches === 1 ? "it" : "them"} ↓</button>`;
        jump.querySelector("button").addEventListener("click", () => {
          const det = qs("#reviewDetails");
          det.open = true;
          const first = [...app.querySelectorAll(".review-item")].find((it) => Math.abs(+it.dataset.level - nearest) < 1e-9);
          if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
        });
      } else {
        jump.classList.add("empty");
        jump.innerHTML = `<button type="button" disabled>No answers this round at ${lvlPct}.</button>`;
      }
    }
    qs("#probeSlider").addEventListener("input", (e) => {
      S.probe.conf = +e.target.value / 100;
      updateProbe();
    });
    app.querySelectorAll("[data-probe-m]").forEach((b) =>
      b.addEventListener("click", () => {
        S.probe.method = b.dataset.probeM;
        app.querySelectorAll("[data-probe-m]").forEach((x) => x.classList.toggle("on", x === b));
        updateProbe();
      }));
    updateProbe();

    app.querySelectorAll("[data-scope]").forEach((b) =>
      b.addEventListener("click", () => { S.scope = b.dataset.scope; renderResults(); }));
    app.querySelector("#btnAgain").addEventListener("click", startRound);
    app.querySelector("#btnHome").addEventListener("click", goHome);
    app.querySelector("#btnHome2").addEventListener("click", goHome);
    const cmp = app.querySelector("#btnCompare");
    if (cmp) cmp.addEventListener("click", () => { S.profile = true; renderCompare(); });
    const vs = app.querySelector("#btnVsAI");
    if (vs) vs.addEventListener("click", () => { S.profile = true; renderCompare(); });
  }

  // Static markup only; the counterfactual value + method name + highlight are
  // filled/updated live by updateProbe() so they track the slider's method.
  function reviewList(records) {
    return records.map((r) => {
      const ok = r.correct;
      return `<div class="review-item" data-level="${r.conf}">
        <div class="row between">
          <span class="muted">${CATS[r.cat] || r.cat} · <span class="tag ${r.diff}">${r.diff}</span></span>
          <span class="pill ${ok ? "ok" : "no"}">${ok ? "correct" : "wrong"}</span>
        </div>
        <p style="margin:6px 0">${esc(r.question)}</p>
        <p class="faint" style="margin:2px 0">Your answer: <strong style="color:${ok ? "var(--good)" : "var(--bad)"}">${esc(r.options[r.chosen])}</strong>${ok ? "" : ` &nbsp;·&nbsp; Correct: <strong style="color:var(--good)">${esc(r.options[r.answerIndex])}</strong>`}</p>
        <p class="faint" style="margin:2px 0">You said <strong>${Math.round(r.conf * 100)}%</strong>, which calibrates to <strong class="cf-value">–</strong>.</p>
      </div>`;
    }).join("");
  }

  // ====================================================================
  // SVG charts (hand-rolled)
  // ====================================================================
  // Reliability-diagram geometry, shared with the probe updater so the
  // slider dot lands exactly on the drawn curves.
  const RG = { W: 560, H: 440, l: 54, r: 18, t: 18, b: 46, x0: 0.2, x1: 1.0 };
  const relX = (c) => RG.l + ((c - RG.x0) / (RG.x1 - RG.x0)) * (RG.W - RG.l - RG.r);
  const relY = (a) => RG.t + (1 - a) * (RG.H - RG.t - RG.b);

  function reliabilityDiagram(records, mdls) {
    const W = RG.W, H = RG.H, m = { l: RG.l, r: RG.r, t: RG.t, b: RG.b };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const x0 = RG.x0, x1 = RG.x1;
    const X = relX, Y = relY;
    const p = records.map((r) => r.conf), y = records.map((r) => (r.correct ? 1 : 0));
    const bins = Calib.groupByLevel(p, p, y);
    const maxN = Math.max(1, ...bins.map((b) => b.n));

    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Reliability diagram">`;
    // grid + axes
    for (let g = 0; g <= 1.0001; g += 0.25) {
      s += `<line x1="${m.l}" y1="${Y(g)}" x2="${W - m.r}" y2="${Y(g)}" stroke="var(--line)" stroke-width="1"/>`;
      s += `<text x="${m.l - 8}" y="${Y(g) + 4}" text-anchor="end">${Math.round(g * 100)}%</text>`;
    }
    for (let g = 0.25; g <= 1.0001; g += 0.25) {
      s += `<text x="${X(g)}" y="${H - m.b + 18}" text-anchor="middle">${Math.round(g * 100)}%</text>`;
    }
    s += `<text x="${m.l + pw / 2}" y="${H - 6}" text-anchor="middle">stated confidence</text>`;
    s += `<text transform="translate(14 ${m.t + ph / 2}) rotate(-90)" text-anchor="middle">empirical accuracy</text>`;
    // perfect diagonal
    s += `<line x1="${X(x0)}" y1="${Y(x0)}" x2="${X(x1)}" y2="${Y(x1)}" stroke="var(--identity)" stroke-width="2" stroke-dasharray="5 5"/>`;

    // method curves
    const grid = [];
    for (let c = x0; c <= x1 + 1e-9; c += 0.02) grid.push(c);
    const path = (fn) => grid.map((c, i) => `${i ? "L" : "M"}${X(c).toFixed(1)} ${Y(Calib.clamp(fn(c), 0, 1)).toFixed(1)}`).join(" ");
    // Linear: straight best-fit line (sampled so the [0,1] clamp shows as a bend)
    s += `<path d="${path(mdls.linear.apply)}" fill="none" stroke="var(--linear)" stroke-width="2.5"/>`;
    // Platt: smooth
    s += `<path d="${path(mdls.platt.apply)}" fill="none" stroke="var(--platt)" stroke-width="2.5"/>`;
    // Isotonic: step through knots
    const iso = mdls.isotonic;
    if (iso.knots.length) {
      let d = "", started = false;
      iso.knots.forEach((k) => {
        const xa = Math.max(x0, k.x), xb = Math.min(x1, k.xHi);
        const yy = Y(Calib.clamp(k.y, 0, 1));
        if (xb < x0 || xa > x1) return;
        d += `${started ? "L" : "M"}${X(xa).toFixed(1)} ${yy.toFixed(1)} L${X(xb).toFixed(1)} ${yy.toFixed(1)} `;
        started = true;
      });
      s += `<path d="${d}" fill="none" stroke="var(--isotonic)" stroke-width="2.5" stroke-linejoin="round"/>`;
    }
    // Binning: step at each seen level
    mdls.binning.levels.forEach((lv) => {
      if (lv.acc == null) return;
      const half = 0.075;
      const xa = Math.max(x0, lv.p - half), xb = Math.min(x1, lv.p + half);
      s += `<line x1="${X(xa)}" y1="${Y(lv.acc)}" x2="${X(xb)}" y2="${Y(lv.acc)}" stroke="var(--binning)" stroke-width="2.5"/>`;
    });

    // your empirical dots with Wilson bars
    bins.forEach((b) => {
      const correct = Math.round(b.acc * b.n);
      const w = Calib.wilson(correct, b.n);
      const cx = X(b.level), cy = Y(b.acc);
      if (w) s += `<line x1="${cx}" y1="${Y(w.lo)}" x2="${cx}" y2="${Y(w.hi)}" stroke="var(--accent)" stroke-width="1.5" opacity="0.7"/>
        <line x1="${cx - 4}" y1="${Y(w.lo)}" x2="${cx + 4}" y2="${Y(w.lo)}" stroke="var(--accent)" stroke-width="1.5" opacity="0.7"/>
        <line x1="${cx - 4}" y1="${Y(w.hi)}" x2="${cx + 4}" y2="${Y(w.hi)}" stroke="var(--accent)" stroke-width="1.5" opacity="0.7"/>`;
      const r = 4 + 7 * Math.sqrt(b.n / maxN);
      s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--accent)" opacity="0.9" stroke="#201a06" stroke-width="1"/>`;
      s += `<text x="${cx}" y="${cy - r - 4}" text-anchor="middle" font-size="10">${b.n}</text>`;
    });
    // interactive probe overlay — positioned by updateProbe() after render
    s += `<g id="probe">
      <line id="probeLine" stroke-dasharray="3 3" stroke-width="1.5"/>
      <circle id="probeDiag" r="3.5" fill="var(--identity)"/>
      <circle id="probeDot" r="7" stroke="#0e1116" stroke-width="1.5"/>
      <text id="probeLabel" font-size="12" font-weight="700"/>
    </g>`;
    s += `</svg>`;
    return s;
  }

  function histogram(records) {
    const counts = LIKERT.map(() => 0);
    records.forEach((r) => { const i = LIKERT.indexOf(r.conf); if (i >= 0) counts[i]++; });
    const W = 560, H = 260, m = { l: 30, r: 14, t: 14, b: 56 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const maxC = Math.max(1, ...counts);
    const bw = pw / LIKERT.length;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Confidence histogram">`;
    counts.forEach((c, i) => {
      const h = (c / maxC) * ph;
      const x = m.l + i * bw + 6, y = m.t + ph - h;
      s += `<rect x="${x}" y="${y}" width="${bw - 12}" height="${h}" rx="4" fill="var(--accent)" opacity="0.85"/>`;
      s += `<text x="${x + (bw - 12) / 2}" y="${y - 5}" text-anchor="middle" font-size="12" fill="var(--ink)">${c}</text>`;
      s += `<text x="${x + (bw - 12) / 2}" y="${m.t + ph + 16}" text-anchor="middle" font-size="10">${Math.round(LIKERT[i] * 100)}%</text>`;
      s += `<text x="${x + (bw - 12) / 2}" y="${m.t + ph + 32}" text-anchor="middle" font-size="9.5" fill="var(--ink-faint)">${LABELS[i].split(" ")[0]}</text>`;
    });
    s += `</svg>`;
    return s;
  }

  function sparkline(rounds) {
    const pts = rounds.filter((r) => r.brier != null && isFinite(r.brier));
    if (pts.length < 2) return "";
    const W = 560, H = 140, m = { l: 40, r: 14, t: 14, b: 24 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const ys = pts.map((p) => p.brier);
    const lo = Math.min(...ys), hi = Math.max(...ys);
    const pad = (hi - lo) * 0.15 || 0.05;
    const yLo = Math.max(0, lo - pad), yHi = hi + pad;
    const X = (i) => m.l + (pts.length === 1 ? pw / 2 : (i / (pts.length - 1)) * pw);
    const Y = (b) => m.t + (1 - (b - yLo) / (yHi - yLo)) * ph;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Brier over time">`;
    [yLo, (yLo + yHi) / 2, yHi].forEach((g) => {
      s += `<line x1="${m.l}" y1="${Y(g)}" x2="${W - m.r}" y2="${Y(g)}" stroke="var(--line)"/>`;
      s += `<text x="${m.l - 6}" y="${Y(g) + 4}" text-anchor="end" font-size="10">${g.toFixed(3)}</text>`;
    });
    const d = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(p.brier).toFixed(1)}`).join(" ");
    s += `<path d="${d}" fill="none" stroke="var(--isotonic)" stroke-width="2.5"/>`;
    pts.forEach((p, i) => { s += `<circle cx="${X(i)}" cy="${Y(p.brier)}" r="3" fill="var(--isotonic)"/>`; });
    s += `</svg>`;
    return s;
  }

  // ====================================================================
  // COMPARE — "You vs. the machines"
  // ====================================================================
  const statOf = (records) => {
    const p = records.map((r) => r.conf), y = records.map((r) => (r.correct ? 1 : 0));
    return { n: p.length, acc: Calib.mean(y), conf: Calib.mean(p), gap: Calib.overconfidenceGap(p, y),
      brier: Calib.brier(p, y), ece: Calib.ece(p, p, y), auroc: Calib.auroc(p, y) };
  };

  // A compact reliability diagram: diagonal + per-level dots (size = count) with
  // Wilson bars. No method curves — one small multiple per player.
  function miniReliability(records, color) {
    const W = 300, H = 220, m = { l: 34, r: 10, t: 10, b: 26 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b, x0 = 0.2, x1 = 1.0;
    const X = (c) => m.l + ((c - x0) / (x1 - x0)) * pw;
    const Y = (a) => m.t + (1 - a) * ph;
    const p = records.map((r) => r.conf), y = records.map((r) => (r.correct ? 1 : 0));
    const bins = Calib.groupByLevel(p, p, y);
    const maxN = Math.max(1, ...bins.map((b) => b.n));
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="reliability">`;
    for (let g = 0; g <= 1.0001; g += 0.5) {
      s += `<line x1="${m.l}" y1="${Y(g)}" x2="${W - m.r}" y2="${Y(g)}" stroke="var(--line)"/>`;
      s += `<text x="${m.l - 5}" y="${Y(g) + 3}" text-anchor="end" font-size="9">${Math.round(g * 100)}</text>`;
    }
    s += `<line x1="${X(x0)}" y1="${Y(x0)}" x2="${X(x1)}" y2="${Y(x1)}" stroke="var(--identity)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    bins.forEach((b) => {
      const correct = Math.round(b.acc * b.n), w = Calib.wilson(correct, b.n);
      const cx = X(b.level), cy = Y(b.acc);
      if (w) s += `<line x1="${cx}" y1="${Y(w.lo)}" x2="${cx}" y2="${Y(w.hi)}" stroke="${color}" stroke-width="1.2" opacity="0.55"/>`;
      s += `<circle cx="${cx}" cy="${cy}" r="${3 + 5 * Math.sqrt(b.n / maxN)}" fill="${color}" opacity="0.9" stroke="#0e1116" stroke-width="1"/>`;
    });
    s += `</svg>`;
    return s;
  }

  function renderCompare() {
    if (!S.probe) S.probe = { conf: 0.85, method: "platt" };
    const you = Store.history().map((r) => ({ conf: r.conf, correct: r.correct }));
    const COLOR = { you: "var(--accent)", opus: "var(--platt)", fable: "var(--isotonic)", haiku: "var(--binning)" };
    const players = [
      { key: "you", label: "You", records: you, note: `${you.length} answers` },
      ...AI_ORDER.map((k) => ({ key: k, label: AI_BASELINES[k].label, records: aiRecords(k),
        note: `n=${AI_BASELINES[k].pairs.length}, hard` })),
    ];
    const stats = Object.fromEntries(players.map((pl) => [pl.key, statOf(pl.records)]));

    // How many models is the player nominally better-calibrated (lower ECE)
    // than? Stated with heavy hedging — this is a point estimate off a small,
    // difficulty-mismatched sample, exactly the thing the site warns against.
    const youEce = stats.you.ece;
    const beat = AI_ORDER.filter((k) => stats[k].ece > youEce).length;
    const g = stats.you.gap;
    const dir = g > 0.08 ? "running overconfident" : g < -0.08 ? "hedging (underconfident)" : "roughly on the diagonal";
    const hist = Store.history();
    const hardFrac = hist.length ? hist.filter((r) => r.diff === "hard").length / hist.length : 0;
    const mismatch = hardFrac < 0.6
      ? ` And it's apples-to-oranges: only ${Math.round(hardFrac * 100)}% of your answers were hard, vs their all-hard sets — play a few hard rounds for a fair fight.`
      : "";
    let verdict;
    if (you.length < 25) {
      verdict = `Too early to call. You've logged ${you.length} answer${you.length === 1 ? "" : "s"}; at this size the comparison below is mostly noise — the error bars on your dots will be enormous. Play ~25+ (ideally hard) before reading anything into it.${mismatch}`;
    } else {
      const rel = beat === 3 ? "lower than all three frontier models"
        : beat === 0 ? "higher than all three frontier models"
        : `lower than ${beat} of the three and higher than ${3 - beat}`;
      verdict = `On these samples your ECE (${pct(youEce, 1)}) is nominally ${rel}, and you're ${dir}. But yours is n=${you.length} against their n=60–75, so treat this as a vibe check, not a verdict.${mismatch} The machines all hedge below what they know — the honest question is whether you do too.`;
    }

    const cell = (st, key) => {
      if (key === "auroc") return st.auroc == null ? "—" : num(st.auroc, 3);
      if (key === "n") return String(st.n);
      if (key === "brier") return num(st.brier, 3);
      if (key === "ece") return pct(st.ece, 1);
      if (key === "gap") return (st.gap > 0 ? "+" : "") + pct(st.gap, 1);
      return pct(st[key]);
    };
    const table = `<table>
      <thead><tr><th>Player</th><th>n</th><th>Acc</th><th>Conf</th><th>Gap</th><th>Brier</th><th>ECE</th><th>AUROC</th></tr></thead>
      <tbody>${players.map((pl) => {
        const st = stats[pl.key], me = pl.key === "you";
        return `<tr${me ? ' style="background:rgba(242,193,78,.10)"' : ""}>
          <td style="text-align:left"><span class="swatch" style="background:${COLOR[pl.key]}"></span>${pl.label}</td>
          <td>${cell(st, "n")}</td><td>${cell(st, "acc")}</td><td>${cell(st, "conf")}</td>
          <td>${cell(st, "gap")}</td><td>${cell(st, "brier")}</td><td>${cell(st, "ece")}</td><td>${cell(st, "auroc")}</td>
        </tr>`;
      }).join("")}</tbody></table>`;

    const smalls = `<div class="grid-mini">${players.map((pl) => `
      <div class="mini">
        <div class="mini-h"><span class="swatch" style="background:${COLOR[pl.key]}"></span>${pl.label}
          <span class="faint" style="font-weight:400"> · ${pl.note}</span></div>
        ${pl.records.length ? miniReliability(pl.records, COLOR[pl.key]) : `<p class="muted" style="font-size:13px">No data yet.</p>`}
      </div>`).join("")}</div>`;

    app.innerHTML = `
      <div class="row between">
        <h1 style="margin:0">Your profile</h1>
        <button class="ghost" id="btnHome">← Home</button>
      </div>
      <div class="seg" role="group" aria-label="Profile view" style="margin-bottom:14px">
        <button id="btnCard">Your card</button>
        <button class="on">You vs. the machines</button>
      </div>
      <div class="card verdict">
        <span class="tag">Head to head</span>
        <p class="muted" style="max-width:640px;margin:8px auto 0">${esc(verdict)}</p>
      </div>
      <h2>Calibration curves, side by side</h2>
      <div class="card">${smalls}
        <p class="faint" style="margin-top:6px">Dots below the dashed line = confidence exceeded accuracy (overconfident); above = under.
        Dot size is how often that confidence level was used; whiskers are 95% Wilson intervals.</p>
      </div>
      <h2>The numbers</h2>
      <div class="card">${table}
        <p class="faint" style="margin-top:8px">Lower Brier/ECE is better; AUROC near 1 means confidence tracks correctness.
        Fable's AUROC is "—" because it went flawless — with no wrong answers there's nothing to discriminate.</p>
      </div>
      <div class="disclaimer">Apples-to-oranges warning: the three models each played a <strong>hard-only</strong> 60–75 question set.
      Your card is whatever difficulties you chose. If you want a fair fight, play a hard round or two before comparing.</div>
      <div class="row" style="margin-top:16px"><button class="ghost" id="btnHome2">Home</button></div>`;

    app.querySelector("#btnCard").addEventListener("click", () => {
      S = { view: "results", profile: true, roundLen: S.roundLen, difficulty: S.difficulty, round: [], scope: "career", hist: Store.history(), probe: S.probe };
      renderResults();
    });
    app.querySelector("#btnHome").addEventListener("click", goHome);
    app.querySelector("#btnHome2").addEventListener("click", goHome);
  }

  // ====================================================================
  function goHome() { S = { view: "home", roundLen: S.roundLen, difficulty: S.difficulty }; renderHome(); }

  renderHome();

  // expose a tiny hook for the headless verification harness
  window.__CAL__ = { Store, sample, startRound, renderCompare, state: () => S };
})();
</script>
</body>
</html>
